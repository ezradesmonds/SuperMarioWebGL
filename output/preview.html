<!doctype html><html lang="id"><meta charset="utf-8"><title>Trailer Mushroom Kingdom — hasil ekspor</title><style>body{background:#101c18;color:#fff4cd;font:18px 'Segoe UI';margin:32px auto;max-width:1100px}video{width:100%;background:#000}p{color:#c9dacb}button{background:#f6d66b;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;margin-right:12px}button:disabled{opacity:.5}</style><h1>Mushroom Kingdom — trailer</h1><p id="info">Memuat video…</p><video id="video" controls preload="auto" src="Mushroom-Kingdom-Trailer.webm"></video><p><button id="play">Putar hasil ekspor</button><button id="convert">Buat MP4</button></p><p id="status">Video final: 864 frame, 24 fps, dengan musik, tanpa credits.</p><script>
const v=document.getElementById('video'),status=document.getElementById('status'),convert=document.getElementById('convert');
v.ondurationchange=v.onloadedmetadata=()=>document.getElementById('info').textContent='WebM · '+v.videoWidth+' × '+v.videoHeight+' · '+v.duration.toFixed(2)+' detik · 24 fps';
v.onerror=()=>status.textContent='Video gagal dimuat';document.getElementById('play').onclick=()=>{v.currentTime=0;v.play()};
convert.onclick=async()=>{try{convert.disabled=true;document.getElementById('play').disabled=true;v.currentTime=0;await v.play();const stream=v.captureStream();const mime='video/mp4;codecs=avc1.42001E,mp4a.40.2';if(!MediaRecorder.isTypeSupported(mime))throw Error('Codec MP4 tidak tersedia');const chunks=[],r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6500000});r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=async()=>{const blob=new Blob(chunks,{type:'video/mp4'});const response=await fetch('/__trailer_export?ext=mp4',{method:'POST',headers:{'Content-Type':'video/mp4'},body:blob});status.textContent=response.ok?'MP4 tersimpan di folder output.':'Konversi gagal disimpan';convert.disabled=false;document.getElementById('play').disabled=false;stream.getTracks().forEach(t=>t.stop());};v.onended=()=>r.stop();v.ontimeupdate=()=>{status.textContent='Konversi MP4: '+v.currentTime.toFixed(1)+' / 36 detik'};r.start(1000);status.textContent='Mengonversi MP4…';}catch(e){status.textContent=e.message;convert.disabled=false;document.getElementById('play').disabled=false;}};
</script></html>
