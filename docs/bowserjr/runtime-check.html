<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{width:1280px;height:800px;display:block}pre{position:absolute;top:0;left:0;background:#fff;font:12px monospace;max-width:100%;white-space:pre-wrap}</style><script>window.requestAnimationFrame=function(){};window.runtimeErrors=[];window.addEventListener('error',e=>runtimeErrors.push(e.message));</script></head><body><canvas id="glcanvas"></canvas><pre id="qa">initializing</pre><script src="../../js/math3d.js"></script><script src="../../js/primitives.js"></script><script src="../../js/sceneNode.js"></script><script src="../../characters/yoshi.js"></script><script src="../../characters/toad.js"></script><script src="../../characters/bowserjr.js"></script><script src="../../js/environment.js"></script><script src="../../js/lighting.js"></script><script src="../../js/main.js"></script><script>window.addEventListener('DOMContentLoaded',()=>{try{const results=[];for(const mode of ['env','bowserjr'])for(const anim of ['idle','walk','action']){setViewMode(mode);setAnimMode(anim);accumTime=2.1;lastTimestamp=1000;renderLoop(1016);const ground=environmentNode.surfaceY;results.push({mode,anim,error:gl.getError(),feet:[yoshiNode,toadNode,bowserJrNode].map(c=>({name:c.name,height:characterFootY(c)+c.position[1]-ground,x:c.position[0],z:c.position[2]}))});}setViewMode('env');setAnimMode('walk');renderLoop(1032);document.getElementById('qa').textContent=JSON.stringify({results,errors:runtimeErrors,shaderLinked:gl.getProgramParameter(shaderProgram.program,gl.LINK_STATUS)});}catch(e){document.getElementById('qa').textContent='ERROR '+e.stack;}});</script></body></html>
