<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Mushroom Kingdom | Yoshi, Toad &amp; Bowser Jr.</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        :root { color-scheme:dark; font-family:'Trebuchet MS','Segoe UI',sans-serif; }
        body { background:#143e30; color:#fffbe9; overflow:hidden; }
        #canvas-container { width:100%;height:100dvh;min-height:520px;position:relative; }
        canvas { width:100%;height:100%;display:block;cursor:grab;touch-action:none; }
        canvas:active { cursor:grabbing; }
        .world-heading { position:absolute;top:30px;left:34px;pointer-events:none;text-shadow:0 2px 16px #124b5240; }
        .world-heading .eyebrow { display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:0.21em;color:#eff9e5; }
        .world-number { display:inline-flex;align-items:center;gap:6px;padding:6px 9px;background:#fff3bb;color:#31513b;border-radius:6px;letter-spacing:0.06em;text-shadow:none; }
        .world-heading h1 { margin-top:10px;font-size:clamp(25px,3vw,42px);line-height:1.05;letter-spacing:-0.055em;font-weight:900; }
        .world-heading p { margin-top:7px;font-size:12px;color:#ecf9ed;letter-spacing:0.015em; }
        .lighting-controls { position:absolute;top:30px;right:30px;display:flex;gap:4px;padding:5px;border:1px solid #ffffff30;border-radius:13px;background:#174637c9;backdrop-filter:blur(14px); }
        button { border:0;font:inherit;cursor:pointer;transition:background .16s,color .16s,transform .16s; }
        button:hover { transform:translateY(-1px); }
        button:focus-visible { outline:2px solid #ffe28b;outline-offset:4px; }
        .lighting-controls button { padding:9px 12px;border-radius:9px;background:transparent;color:#eff8eb;font-size:11px;font-weight:700; }
        .lighting-controls button.active { background:#fff1b9;color:#244b35; }
        .toolbar { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:15px;max-width:calc(100% - 32px);width:max-content;padding:12px 16px;background:#123c2eeb;border:1px solid #ffffff24;border-radius:18px;box-shadow:0 8px 35px #102a2740;backdrop-filter:blur(18px); }
        .toolbar-label { font-size:9px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:#a6c7ab; }
        .group { display:flex;gap:4px; }
        .group button { padding:10px 12px;border-radius:10px;background:transparent;color:#f1f8e6;font-size:12px;font-weight:700;white-space:nowrap; }
        .group button:hover { background:#ffffff12; }
        .group button.active { background:#f8d66b;color:#22432e;box-shadow:0 2px 7px #051d2220; }
        .toolbar-divider { width:1px;height:25px;background:#ffffff20; }
        .controls-hint { position:absolute;bottom:106px;left:50%;transform:translateX(-50%);padding:7px 12px;white-space:nowrap;border-radius:8px;font-size:10px;font-weight:700;color:#f0f8e8;text-shadow:0 1px 5px #193d31;pointer-events:none;background:#16412e36; }
        .controls-hint span { opacity:.6;padding:0 7px; }
        .view-reset { position:absolute;right:30px;bottom:112px;width:34px;height:34px;border-radius:50%;background:#173f30bb;border:1px solid #ffffff30;color:#fff2bc;font-size:20px; }
        @media(max-width:900px) {
            .toolbar { flex-wrap:wrap;gap:6px 10px;max-width:calc(100% - 24px);padding:10px 12px; }
            .toolbar-label { display:none; }
            .group button { padding:9px 10px;font-size:11px; }
        }
        @media(max-width:600px) {
            .world-heading { top:20px;left:20px; }.world-heading .eyebrow { font-size:8px;letter-spacing:.1em; }
            .world-heading h1 { font-size:27px; }.world-heading p { font-size:10px;max-width:180px; }
            .lighting-controls { top:20px;right:14px;flex-direction:column;padding:4px; }.lighting-controls button { padding:7px 8px;font-size:9px; }
            .toolbar { bottom:14px;width:calc(100% - 24px);gap:6px; }.group { justify-content:center;flex-wrap:wrap;gap:2px; }.group button { padding:8px 9px;font-size:10px; }
            .toolbar-divider { display:none; }.controls-hint { bottom:121px;font-size:9px;padding:6px 8px; }.controls-hint span { padding:0 3px; }
            .view-reset { right:16px;bottom:139px; }
        }
        @media(prefers-reduced-motion:reduce) { button { transition:none; } }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="glcanvas" tabindex="0" aria-label="Dunia Mario tiga dimensi"></canvas>
        <header class="world-heading">
            <div class="eyebrow"><span class="world-number">&#9733; WORLD 1&ndash;1</span> THE GREEN GARDENS</div>
            <h1>Mushroom Kingdom</h1>
            <p>Satu dunia kecil. Tiga petualang.</p>
        </header>
        <div class="lighting-controls" aria-label="Pencahayaan">
            <button class="active" data-lighting="day" onclick="setLightingMode('day')" aria-pressed="true">&#9728; Daylight</button>
            <button data-lighting="golden" onclick="setLightingMode('golden')" aria-pressed="false">&#9684; Golden hour</button>
        </div>
        <div class="controls-hint">Drag kiri: orbit <span>/</span> Drag kanan: geser <span>/</span> Scroll: zoom</div>
        <button class="view-reset" onclick="setViewMode('env')" title="Reset kamera" aria-label="Reset kamera">&#8634;</button>
    </div>
    <nav class="toolbar" aria-label="Pilihan karakter dan animasi">
        <span class="toolbar-label">Karakter</span>
        <div class="group" aria-label="Pilih karakter">
            <button id="btn-all" class="active" onclick="setViewMode('all')" aria-pressed="true">Semua Karakter</button>
            <button id="btn-yoshi" onclick="setViewMode('yoshi')" aria-pressed="false">Yoshi</button>
            <button id="btn-toad" onclick="setViewMode('toad')" aria-pressed="false">Toad</button>
            <button id="btn-bowserjr" onclick="setViewMode('bowserjr')" aria-pressed="false">Bowser Jr.</button>
            <button id="btn-env" onclick="setViewMode('env')">Dunia Mario</button>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <span class="toolbar-label">Gerak</span>
        <div class="group" aria-label="Pilih animasi">
            <button id="anim-walk" onclick="setAnimMode('walk')" aria-pressed="false">Berjalan</button>
            <button id="anim-action" onclick="setAnimMode('action')" aria-pressed="false">Aksi</button>
            <button id="anim-idle" class="active" onclick="setAnimMode('idle')" aria-pressed="true">Idle / Diam</button>
        </div>
    </nav>
    <script src="js/math3d.js"></script>
    <script src="js/primitives.js"></script>
    <script src="js/sceneNode.js"></script>
    <script src="characters/yoshi.js"></script>
    <script src="characters/toad.js"></script>
    <script src="characters/bowserjr.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/lighting.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
